[project]
name = "ledger"
version = "0.1.0"
description = "Personal finance agent — ingests statements, answers questions, reasons over your money."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nakul Bharadwaj" }
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=1.1.0",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.0.0",
]
plaid = [
    "plaid-python>=20.0.0",
]

[project.scripts]
ledger = "ledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ledger --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
